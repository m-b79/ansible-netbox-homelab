---
- name: Check supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: "This role currently supports Ubuntu only."

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ linux_patching_cache_valid_time }}"

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: safe
  register: linux_patching_upgrade_result
  when: linux_patching_apply | bool

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: linux_patching_reboot_required

- name: Display maintenance summary
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
      - "Upgrade requested: {{ linux_patching_apply }}"
      - "Packages changed: {{ linux_patching_upgrade_result.changed | default(false) }}"
      - "Reboot required: {{ linux_patching_reboot_required.stat.exists }}"

- name: Reboot server if authorized and required
  ansible.builtin.reboot:
    reboot_timeout: 600
    post_reboot_delay: 10
  when:
    - linux_patching_apply | bool
    - linux_patching_reboot_enabled | bool
    - linux_patching_reboot_required.stat.exists
