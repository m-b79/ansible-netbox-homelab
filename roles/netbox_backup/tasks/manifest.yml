---
- name: Define backup identifier
  ansible.builtin.set_fact:
    netbox_backup_id: >-
      {{ netbox_backup_filename
         | regex_replace('\.pgc$', '') }}

- name: Calculate local database checksum
  ansible.builtin.stat:
    path: "{{ netbox_backup_local_directory }}/{{ netbox_backup_filename }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: netbox_backup_database_stat

- name: Calculate local media checksum
  ansible.builtin.stat:
    path: "{{ netbox_backup_local_directory }}/{{ netbox_backup_media_file | basename }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: netbox_backup_media_stat

- name: Ensure both archives are available
  ansible.builtin.assert:
    that:
      - netbox_backup_database_stat.stat.isreg | default(false)
      - netbox_backup_media_stat.stat.isreg | default(false)

- name: Generate backup manifest
  ansible.builtin.copy:
    dest: "{{ netbox_backup_local_directory }}/{{ netbox_backup_id }}_manifest.yml"
    mode: '0600'
    content: |
      ---
      backup_id: {{ netbox_backup_id }}
      source_host: {{ inventory_hostname }}
      database: {{ netbox_backup_database }}
      archives:
        database:
          filename: {{ netbox_backup_filename }}
          sha256: {{ netbox_backup_database_stat.stat.checksum }}
        media:
          filename: {{ netbox_backup_media_file | basename }}
          sha256: {{ netbox_backup_media_stat.stat.checksum }}
  delegate_to: localhost
  become: false
